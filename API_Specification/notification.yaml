openapi: 3.0.3

info:
  title: CAB System API
  description: API Authentication cho hệ thống CAB System
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Local Server

paths:

  /notifications:
    get:
      tags:
        - Notification
      summary: Lấy danh sách thông báo
      description: |
        Lấy danh sách thông báo của người dùng đang đăng nhập.

        Notification được tạo khi xảy ra các sự kiện:
        - Đặt xe thành công
        - Có yêu cầu chuyến xe gửi đến tài xế
        - Tài xế được phân công
        - Tài xế chấp nhận chuyến
        - Tài xế đang đến
        - Chuyến xe hoàn thành
        - Thanh toán thành công
        - Thanh toán thất bại
        - Không tìm được tài xế

        MVP chỉ hỗ trợ thông báo trong hệ thống.
        SMS, Email và Push Notification thuộc Future Scope.
      security:
        - bearerAuth: []
      parameters:
        - name: isRead
          in: query
          required: false
          schema:
            type: boolean
          description: Lọc thông báo đã đọc hoặc chưa đọc
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Lấy danh sách thông báo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  total:
                    type: integer
                    example: 5
        '401':
          description: Chưa đăng nhập


  /notifications/{notificationId}:
    get:
      tags:
        - Notification
      summary: Xem chi tiết thông báo
      description: |
        Cho phép người dùng xem nội dung của một thông báo.
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
          description: ID của thông báo
      responses:
        '200':
          description: Lấy thông báo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          description: Chưa đăng nhập
        '403':
          description: Không có quyền xem thông báo
        '404':
          description: Không tìm thấy thông báo


  /notifications/{notificationId}/read:
    patch:
      tags:
        - Notification
      summary: Đánh dấu thông báo đã đọc
      description: |
        Cập nhật trạng thái thông báo từ chưa đọc sang đã đọc.
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
          description: ID của thông báo
      responses:
        '200':
          description: Đánh dấu đã đọc thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          description: Chưa đăng nhập
        '403':
          description: Không có quyền cập nhật thông báo
        '404':
          description: Không tìm thấy thông báo


  /notifications/read-all:
    patch:
      tags:
        - Notification
      summary: Đánh dấu tất cả thông báo đã đọc
      description: |
        Đánh dấu toàn bộ thông báo của người dùng hiện tại là đã đọc.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Đánh dấu tất cả thông báo đã đọc thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Tất cả thông báo đã được đánh dấu là đã đọc
                  updatedCount:
                    type: integer
                    example: 5
        '401':
          description: Chưa đăng nhập


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  schemas:

    Notification:
      type: object
      properties:
        notificationId:
          type: string
          example: NOT001

        userId:
          type: string
          example: US001

        type:
          type: string
          enum:
            - BOOKING_CREATED
            - TRIP_REQUEST
            - DRIVER_CONFIRMED
            - DRIVER_ACCEPTED
            - DRIVER_ARRIVING
            - TRIP_COMPLETED
            - PAYMENT_SUCCESS
            - PAYMENT_FAILED
            - NO_DRIVER
          example: DRIVER_ACCEPTED

        title:
          type: string
          example: Tài xế đã nhận chuyến

        message:
          type: string
          example: Tài xế Nguyễn Văn A đã chấp nhận chuyến xe của bạn.

        tripId:
          type: string
          nullable: true
          example: TRIP001

        isRead:
          type: boolean
          example: false

        createdAt:
          type: string
          format: date-time
          example: "2026-09-13T10:30:00Z"
