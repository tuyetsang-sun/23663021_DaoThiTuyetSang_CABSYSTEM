```yaml
paths:

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản Customer
      description: |
        Tạo tài khoản Customer mới.
        Email và số điện thoại phải là duy nhất.
        Mật khẩu không được lưu dưới dạng plaintext.
      operationId: registerCustomer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:
        '201':
          description: Đăng ký tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

        '400':
          description: Dữ liệu đăng ký không hợp lệ

        '409':
          description: Email hoặc số điện thoại đã tồn tại


  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập
      description: |
        Cho phép Customer, Driver và Operation Staff đăng nhập.
        Hệ thống kiểm tra thông tin xác thực và xác định vai trò người dùng.
      operationId: login

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '401':
          description: Email hoặc mật khẩu không chính xác

        '403':
          description: Tài khoản bị khóa hoặc không được phép đăng nhập

        '400':
          description: Dữ liệu đăng nhập không hợp lệ


  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Đăng xuất
      description: Đăng xuất người dùng hiện tại.
      operationId: logout

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Đăng xuất thành công

        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ


components:

  schemas:

    RegisterRequest:
      type: object
      required:
        - fullName
        - phone
        - email
        - password

      properties:

        fullName:
          type: string
          example: Nguyễn Văn A
          description: Họ và tên Customer

        phone:
          type: string
          example: "0901234567"
          description: Số điện thoại duy nhất

        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
          description: Email duy nhất

        password:
          type: string
          format: password
          minLength: 6
          example: "Password123"
          description: Mật khẩu đăng nhập


    RegisterResponse:
      type: object
      properties:

        message:
          type: string
          example: Đăng ký tài khoản thành công

        userId:
          type: integer
          example: 1001

        role:
          type: string
          enum:
            - CUSTOMER
          example: CUSTOMER


    LoginRequest:
      type: object
      required:
        - email
        - password

      properties:

        email:
          type: string
          format: email
          example: nguyenvana@gmail.com

        password:
          type: string
          format: password
          example: "Password123"


    LoginResponse:
      type: object
      properties:

        message:
          type: string
          example: Đăng nhập thành công

        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9

        user:
          $ref: '#/components/schemas/AuthUser'


    AuthUser:
      type: object
      properties:

        userId:
          type: integer
          example: 1001

        fullName:
          type: string
          example: Nguyễn Văn A

        email:
          type: string
          format: email
          example: nguyenvana@gmail.com

        role:
          type: string
          enum:
            - CUSTOMER
            - DRIVER
            - OPERATION_STAFF
          example: CUSTOMER

        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED
          example: ACTIVE


  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
```
